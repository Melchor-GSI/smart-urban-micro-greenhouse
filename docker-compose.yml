services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: iot-mqtt-broker
    ports:
      - "1883:1883"
      # - "9001:9001" # WebSocket (descomenta si lo necesitas)
    volumes:
      - ./mosquitto_broker/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 1883"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:6
    container_name: iot-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: iot_db
    volumes:
      - mongo_data:/data/db
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    container_name: iot-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      mqtt-broker:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  simulator:
    build:
      context: ./simulator
    container_name: iot-simulator
    env_file:
      - ./simulator/.env
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('mqtt-broker',1883)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  node-red:
    image: nodered/node-red:latest
    container_name: iot-node-red
    ports:
      - "1880:1880"
    volumes:
      - ./node-red/data:/data
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1880" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  iot-network:
    driver: bridge

volumes:
  mongo_data:
  mqtt_data:
  mqtt_log: