version: "3.8"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto_broker/config:/mosquitto/config
      - ./mosquitto_broker/data:/mosquitto/data
      - ./mosquitto_broker/log:/mosquitto/log
    networks:
      - iot-network

  backend:
    build:
      context: ./backend
    container_name: iot-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mqtt-broker
    networks:
      - iot-network

  simulator:
    build:
      context: ./simulator
    container_name: iot-simulator
    env_file:
      - ./simulator/.env
    depends_on:
      - mqtt-broker
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge