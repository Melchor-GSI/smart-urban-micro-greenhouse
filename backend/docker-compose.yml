version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: iot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: iot_db
    volumes:
      - mongodb_data:/data/db
      # - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-backend
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/iot_db?authSource=admin
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=iot_db
      - MONGODB_USERNAME=admin
      - MONGODB_PASSWORD=password123
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - iot-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  iot-network:
    driver: bridge

volumes:
  iot-data:
    driver: local
  mongodb_data:
    driver: local
